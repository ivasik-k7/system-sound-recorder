name: Feature request
description: Something the recorder should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        The situation, not the feature. "I need to keep the last five minutes
        after something interesting happens" leads somewhere better than "add a
        ring buffer" does.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: If you have a specific shape in mind, describe it here.

  - type: checkboxes
    id: checked
    attributes:
      label: Before filing
      options:
        - label: I checked docs/PLAN.md, which lists what is deliberately not built yet and why.
          required: true
